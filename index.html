<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#092C4B">
<title>FIATA Events</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FIATA Events">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--mid:#071C35;--navy:#0A2540;--blue:#0077C8;--cyan:#22B8F0;--bg:#F6F8FC;--card:#fff;--tx:#102239;--tx2:#64748B;--tx3:#94A3B8;--bd:#E4EAF2;--ok:#16A34A;--warn:#D97706;--err:#DC2626;--ease:cubic-bezier(.2,.8,.2,1);--sh:0 1px 2px rgba(16,34,57,.04),0 4px 16px rgba(16,34,57,.06)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'Plus Jakarta Sans',Inter,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:#081424;color:var(--tx);-webkit-font-smoothing:antialiased;font-size:14px;line-height:1.45}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
input,textarea{font:inherit;color:inherit}
.ic{flex:none;display:block}

/* ---------- Desktop canvas ---------- */
.stage{min-height:100vh;display:flex;align-items:center;justify-content:center;gap:64px;padding:32px;background:radial-gradient(1200px 600px at 75% 10%,#0d3a66 0%,transparent 60%),radial-gradient(800px 500px at 10% 90%,#0a2c4f 0%,transparent 60%),#071C35}
.side{width:320px;color:#cfe0f2}
.side .k{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--cyan);font-weight:700}
.side h1{font-size:30px;line-height:1.15;color:#fff;margin:10px 0 12px;letter-spacing:-.02em}
.side p{font-size:14px;color:#9fb6cf;margin-bottom:22px}
.flows{display:grid;gap:6px}
.flows button{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:12px;color:#dbe8f5;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.03);transition:background .2s}
.flows button:hover{background:rgba(34,184,240,.1);border-color:rgba(34,184,240,.35)}
.flows b{width:24px;height:24px;border-radius:7px;background:rgba(34,184,240,.15);color:var(--cyan);display:grid;place-items:center;font-size:12px}
.side small{display:block;margin-top:18px;color:#6f89a6;font-size:12px}
.device{--sat:46px;--sab:18px;width:390px;height:844px;border-radius:52px;background:var(--bg);position:relative;overflow:hidden;box-shadow:0 0 0 11px #0c1829,0 0 0 12px #2a3d57,0 50px 120px rgba(0,0,0,.55);flex:none}
.sbar{position:absolute;top:0;left:0;right:0;height:46px;z-index:90;display:flex;justify-content:space-between;align-items:center;padding:6px 30px 0 36px;font-weight:600;font-size:15px;pointer-events:none;color:var(--tx);transition:color .3s}
.sbar .isl{position:absolute;left:50%;top:11px;width:118px;height:34px;margin-left:-59px;background:#000;border-radius:20px}
.device.sb-light .sbar{color:#fff}
@media (max-width:860px){.stage{padding:0;display:block;background:var(--bg)}.side{display:none}.device{--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);width:100%;height:100vh;height:100dvh;border-radius:0;box-shadow:none}.sbar{display:none}}
#app{position:absolute;inset:0}

/* ---------- Screens ---------- */
.screen{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg)}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;scrollbar-width:none}
.scroll::-webkit-scrollbar,.hs::-webkit-scrollbar{display:none}
.anim-push{animation:push .36s var(--ease)}
.anim-pop{animation:pop .3s var(--ease)}
.anim-fade{animation:fadeup .3s var(--ease)}
@keyframes push{from{transform:translateX(30%);opacity:0}}
@keyframes pop{from{transform:translateX(-14%);opacity:0}}
@keyframes fadeup{from{opacity:0;transform:translateY(6px)}}
@keyframes fade{from{opacity:0}}
@keyframes sheetin{from{transform:translateY(100%)}}
@keyframes sheetout{to{transform:translateY(100%)}}
@keyframes fadeout{to{opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes shimmer{to{background-position:-200% 0}}
@keyframes pulse{50%{transform:scale(1.04)}}
.pad{padding:0 20px}
.sec{margin-top:28px}
.sech{display:flex;align-items:baseline;justify-content:space-between;padding:0 20px;margin-bottom:12px}
.sech h3{font-size:18px;font-weight:700;letter-spacing:-.01em}
.link{color:var(--blue);font-weight:600;font-size:13px;min-height:44px;display:inline-flex;align-items:center;gap:2px}
.muted{color:var(--tx2)}
.tiny{font-size:12px;color:var(--tx2)}
.demo{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#8a5a00;background:#FFF4DB;border:1px solid #F6DFA6;padding:3px 8px;border-radius:99px}
.demo.dk{color:#ffe7a8;background:rgba(255,200,80,.14);border-color:rgba(255,200,80,.3)}
.press{transition:transform .15s var(--ease),box-shadow .2s}
.press:active{transform:scale(.975)}

/* headers */
.ttl{padding:calc(var(--sat) + 10px) 20px 6px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.ttl h1{font-size:24px;font-weight:700;letter-spacing:-.02em;line-height:1.2}
.ttl .ctx{font-size:13px;color:var(--tx2);margin-top:2px}
.ibtn{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:var(--tx);position:relative;flex:none}
.ibtn:active{background:rgba(16,34,57,.06)}
.ibtn.card{background:#fff;border:1px solid var(--bd)}
.phdr{padding:calc(var(--sat) + 2px) 8px 6px;display:flex;align-items:center;gap:2px;background:rgba(246,248,252,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);position:relative;z-index:5}
.phdr h2{font-size:17px;font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.phdr.dk{background:transparent;color:#fff;position:absolute;left:0;right:0;top:0}
.phdr.dk .ibtn{background:rgba(7,28,53,.35);backdrop-filter:blur(10px);color:#fff}

/* home */
.hnavy{background:var(--mid);color:#fff;padding:calc(var(--sat) + 8px) 16px 64px 20px;position:relative;overflow:hidden}
.hnavy::after{content:"";position:absolute;right:-80px;top:-60px;width:260px;height:260px;border-radius:50%;border:1px solid rgba(34,184,240,.18);box-shadow:0 0 0 40px rgba(34,184,240,.04),0 0 0 80px rgba(34,184,240,.025)}
.hrow{display:flex;align-items:center;justify-content:space-between;position:relative;z-index:1}
.brand{display:flex;align-items:center;gap:10px}
.mark{width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,var(--blue),var(--cyan));display:grid;place-items:center;color:#fff;flex:none}
.brand .bn1{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#8fb3d6}
.evsw{display:flex;align-items:center;gap:4px;font-weight:700;font-size:15px;color:#fff;min-height:28px}
.hact{display:flex;gap:6px;align-items:center}
.hact .ibtn{color:#fff;background:rgba(255,255,255,.08)}
.av{border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;flex:none;letter-spacing:.02em}
.hero{margin:-50px 16px 0;border-radius:24px;overflow:hidden;position:relative;aspect-ratio:16/11;box-shadow:0 20px 40px -12px rgba(7,28,53,.35);display:block;width:calc(100% - 32px)}
.hero .art{position:absolute;inset:0;width:100%;height:100%}
.hero .ov{position:absolute;inset:0;background:linear-gradient(180deg,rgba(7,28,53,0) 35%,rgba(7,28,53,.85));padding:20px;display:flex;flex-direction:column;justify-content:flex-end;color:#fff}
.hero h2{font-size:27px;font-weight:800;line-height:1.12;letter-spacing:-.025em;max-width:85%}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.glass{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:6px 10px;border-radius:99px;background:rgba(255,255,255,.14);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.18)}
.prim{display:grid;grid-template-columns:1.3fr 1fr;gap:12px;padding:0 16px;margin-top:16px}
.pa{border-radius:20px;padding:16px;min-height:150px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.pa.a{background:linear-gradient(160deg,var(--navy),#0b3765);color:#fff}
.pa.a::before{content:"";position:absolute;right:-30px;bottom:-30px;width:120px;height:120px;border-radius:50%;background:radial-gradient(circle,rgba(34,184,240,.35),transparent 70%)}
.pa.b{background:#fff;border:1px solid var(--bd);box-shadow:var(--sh)}
.pa .pi{width:40px;height:40px;border-radius:12px;display:grid;place-items:center}
.pa.a .pi{background:rgba(34,184,240,.18);color:var(--cyan)}
.pa.b .pi{background:#E8F3FB;color:var(--blue)}
.pa h4{font-size:16px;font-weight:700;margin-top:14px;letter-spacing:-.01em}
.pa p{font-size:12px;margin-top:3px;opacity:.75;line-height:1.35}
.pa .go{position:absolute;right:14px;top:14px;opacity:.7}

/* cards & lists */
.card{background:#fff;border:1px solid var(--bd);border-radius:18px;box-shadow:var(--sh)}
.glist{margin:0 16px;background:#fff;border:1px solid var(--bd);border-radius:18px;overflow:hidden}
.gi{display:flex;align-items:center;gap:14px;padding:12px 14px;min-height:60px;width:100%;position:relative}
.gi+.gi::before{content:"";position:absolute;top:0;left:64px;right:0;height:1px;background:var(--bd)}
.gi:active{background:#F3F6FB}
.gi .t{font-weight:600;font-size:15px}
.gi .s{font-size:12px;color:var(--tx2)}
.gi .grow{flex:1;min-width:0}
.tint{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;flex:none}
.t-blue{background:#E8F3FB;color:var(--blue)}.t-cyan{background:#E3F6FD;color:#0891B2}.t-navy{background:#E7ECF3;color:var(--navy)}.t-green{background:#E8F6EE;color:var(--ok)}.t-amber{background:#FDF3E3;color:var(--warn)}.t-red{background:#FDECEC;color:var(--err)}
.chev{color:var(--tx3)}
.empty{text-align:center;padding:26px 22px}
.empty .eic{width:52px;height:52px;border-radius:16px;margin:0 auto 12px;display:grid;place-items:center;background:#EEF3F9;color:var(--blue)}
.empty h4{font-size:15px;font-weight:700}
.empty p{font-size:13px;color:var(--tx2);margin:4px auto 14px;max-width:260px}

/* buttons */
.btn{height:50px;border-radius:13px;padding:0 18px;font-weight:700;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .15s var(--ease),background .2s,opacity .2s;width:100%;text-align:center}
.btn:active{transform:scale(.98)}
.btn.p{background:var(--blue);color:#fff;box-shadow:0 6px 16px -6px rgba(0,119,200,.6)}
.btn.p:hover{background:#006bb4}
.btn.s{background:#EAF2FA;color:var(--blue)}
.btn.g{background:#fff;border:1px solid var(--bd);color:var(--tx)}
.btn.d{background:var(--err);color:#fff}
.btn.dg{background:#FDECEC;color:var(--err)}
.btn.sm{height:40px;font-size:13px;border-radius:11px;width:auto;padding:0 14px}
.btn[disabled]{opacity:.45;pointer-events:none;box-shadow:none}
.spin{width:18px;height:18px;border-radius:50%;border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;animation:spin .7s linear infinite}

/* bottom nav */
.bnav{display:grid;grid-template-columns:repeat(5,1fr);padding:6px 8px calc(6px + var(--sab));background:rgba(255,255,255,.94);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--bd);position:relative;flex:none}
.bind{position:absolute;top:8px;height:32px;width:56px;border-radius:12px;background:#E6F2FB;left:calc(8px + (var(--i) + .5) * ((100% - 16px) / 5) - 28px);transition:left .38s var(--ease)}
.bn{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0 4px;color:var(--tx3);font-size:10.5px;font-weight:600;position:relative;min-height:52px;text-align:center}
.bn svg{margin-top:3px}
.bn.on{color:var(--blue)}

/* chips / segmented */
.seg{display:flex;background:#E9EEF5;border-radius:13px;padding:4px;margin:0 20px;position:relative}
.seg button{flex:1;height:38px;border-radius:10px;font-weight:600;font-size:13px;color:var(--tx2);text-align:center;transition:all .25s var(--ease)}
.seg button.on{background:#fff;color:var(--tx);box-shadow:0 1px 3px rgba(16,34,57,.12)}
.seg.dk{background:rgba(255,255,255,.08)}
.seg.dk button{color:#9fb6cf}
.seg.dk button.on{background:#fff;color:var(--navy)}
.hs{display:flex;gap:10px;overflow-x:auto;padding:2px 20px 4px;scroll-snap-type:x proximity;scrollbar-width:none}
.dchip{flex:none;width:72px;padding:10px 0;border-radius:16px;background:#fff;border:1px solid var(--bd);text-align:center;scroll-snap-align:start;transition:all .25s var(--ease)}
.dchip .w{font-size:11px;font-weight:600;color:var(--tx2);text-transform:uppercase;letter-spacing:.06em}
.dchip .n{font-size:22px;font-weight:800;letter-spacing:-.02em;margin:1px 0}
.dchip .l{font-size:11px;color:var(--tx2)}
.dchip.on{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 10px 20px -8px rgba(0,119,200,.6)}
.dchip.on .w,.dchip.on .l{color:rgba(255,255,255,.8)}
.fchip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 6px 0 12px;border-radius:99px;background:#E8F3FB;color:var(--blue);font-size:12.5px;font-weight:600;flex:none}
.fchip span{width:22px;height:22px;display:grid;place-items:center;border-radius:50%}

/* search */
.search{display:flex;align-items:center;gap:10px;height:46px;padding:0 14px;border-radius:13px;background:#fff;border:1px solid var(--bd);flex:1;color:var(--tx3);transition:border .2s,box-shadow .2s}
.search:focus-within{border-color:var(--blue);box-shadow:0 0 0 4px rgba(0,119,200,.1)}
.search input{border:0;outline:0;background:none;flex:1;min-width:0;font-size:15px;color:var(--tx)}
.srow{display:flex;gap:10px;padding:0 20px}
.fbtn{width:46px;height:46px;border-radius:13px;border:1px solid var(--bd);background:#fff;display:grid;place-items:center;position:relative;flex:none}
.fbtn.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.badge{position:absolute;top:-5px;right:-5px;min-width:19px;height:19px;border-radius:10px;background:var(--cyan);color:var(--mid);font-size:11px;font-weight:800;display:grid;place-items:center;padding:0 5px;border:2px solid var(--bg)}

/* fields */
.fl{display:block;font-size:12px;font-weight:700;color:var(--tx2);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
.inp{width:100%;height:52px;border-radius:12px;border:1.5px solid var(--bd);background:#fff;padding:0 16px;font-size:16px;outline:none;transition:border .2s,box-shadow .2s}
.inp:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(0,119,200,.12)}
.inp.err{border-color:var(--err);box-shadow:0 0 0 4px rgba(220,38,38,.08)}
textarea.inp{height:auto;min-height:96px;padding:14px 16px;resize:none;line-height:1.5;font-size:15px}
.code{letter-spacing:.5em;font-weight:700;font-size:22px;text-align:center}
.msg{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;font-size:13px;line-height:1.45;margin-top:12px}
.msg.e{background:#FDECEC;color:#9b1c1c}
.msg.i{background:#EAF2FA;color:#0b4a7a}
.msg.o{background:#E8F6EE;color:#0f5f2f}
.msg.w{background:#FFF4DB;color:#7a4b00}
.msg svg{margin-top:1px}

/* sheets */
.sw{position:absolute;inset:0;z-index:60;display:flex;flex-direction:column;justify-content:flex-end}
.scrim{position:absolute;inset:0;background:rgba(7,28,53,.48)}
.sheet{position:relative;background:#fff;border-radius:26px 26px 0 0;max-height:90%;display:flex;flex-direction:column;padding-bottom:var(--sab);box-shadow:0 -10px 40px rgba(7,28,53,.2)}
.sw.in .sheet{animation:sheetin .4s var(--ease)}
.sw.in .scrim{animation:fade .3s}
.sw.out .sheet{animation:sheetout .24s ease-in forwards}
.sw.out .scrim{animation:fadeout .24s forwards}
.grab{width:38px;height:5px;border-radius:3px;background:#D5DDE8;margin:9px auto 2px;flex:none}
.shd{display:flex;align-items:center;justify-content:space-between;padding:8px 12px 6px 22px;flex:none}
.shd h3{font-size:19px;font-weight:700;letter-spacing:-.01em}
.sbody{overflow-y:auto;padding:4px 22px 18px;scrollbar-width:none}
.sbody::-webkit-scrollbar{display:none}
.sfoot{padding:12px 22px 14px;border-top:1px solid var(--bd);display:flex;gap:10px;flex:none}
.foot{padding:12px 16px calc(12px + var(--sab));background:rgba(255,255,255,.94);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--bd);flex:none}

/* events discovery */
.evhead{padding:calc(var(--sat) + 14px) 20px 18px;background:linear-gradient(180deg,#fff,var(--bg))}
.evhead h1{font-size:30px;font-weight:800;letter-spacing:-.03em;margin:18px 0 4px}
.evc{display:block;width:calc(100% - 32px);margin:0 16px 18px;border-radius:24px;overflow:hidden;background:#fff;border:1px solid var(--bd);box-shadow:var(--sh)}
.evc .img{position:relative;aspect-ratio:16/10}
.evc .img .art{position:absolute;inset:0;width:100%;height:100%}
.evc .img .tag{position:absolute;left:14px;top:14px}
.evc .body{padding:16px 18px 18px}
.evc h3{font-size:19px;font-weight:700;letter-spacing:-.015em}
.evc .row{display:flex;align-items:center;justify-content:space-between;margin-top:14px}
.ph{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--tx2);border:1px dashed #C9D4E3;border-radius:8px;padding:4px 8px}
.enter{display:inline-flex;align-items:center;gap:6px;font-weight:700;color:var(--blue);font-size:14px}

/* splash */
.splash{position:absolute;inset:0;background:radial-gradient(120% 70% at 50% 35%,#fff 0%,#EAF4FC 55%,#D6EAF8 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer}
.splash .orb{position:absolute;width:520px;height:520px;border-radius:50%;border:1px solid rgba(0,119,200,.1);box-shadow:0 0 0 60px rgba(0,119,200,.03),0 0 0 120px rgba(0,119,200,.02);top:50%;left:50%;margin:-300px 0 0 -260px}
.splash .lg{width:96px;height:96px;border-radius:30px;background:linear-gradient(140deg,var(--navy),var(--blue) 60%,var(--cyan));display:grid;place-items:center;color:#fff;box-shadow:0 24px 50px -14px rgba(0,119,200,.55);animation:logo 1.1s var(--ease) both}
.splash h1{margin-top:22px;font-size:26px;font-weight:800;letter-spacing:-.02em;color:var(--navy);animation:fadeup .8s .35s var(--ease) both}
.splash .pw{position:absolute;bottom:calc(36px + var(--sab));font-size:12px;color:var(--tx2);animation:fade 1s .6s both}
.splash .pw b{color:var(--navy)}
@keyframes logo{from{opacity:0;transform:scale(.82)}}

/* agenda */
.demo-bar{margin:4px 20px 14px;display:flex;gap:8px;align-items:center;font-size:12px;color:#7a4b00}
.tl{padding:10px 16px 24px 16px}
.slot{display:grid;grid-template-columns:52px 18px 1fr;gap:0 8px}
.slot .tm{font-size:13px;font-weight:700;padding-top:16px;text-align:right;font-variant-numeric:tabular-nums}
.slot .tm small{display:block;font-weight:500;color:var(--tx3);font-size:11px}
.slot .ln{position:relative}
.slot .ln::before{content:"";position:absolute;left:8px;top:0;bottom:0;width:2px;background:var(--bd)}
.slot:first-child .ln::before{top:20px}
.slot:last-child .ln::before{bottom:calc(100% - 22px)}
.slot .ln i{position:absolute;left:3px;top:19px;width:12px;height:12px;border-radius:50%;background:#fff;border:2.5px solid var(--blue)}
.slot.brk .ln i{border-color:var(--tx3)}
.sess{display:block;width:100%;margin:6px 0;padding:14px 14px 12px;border-radius:18px;background:#fff;border:1px solid var(--bd);box-shadow:var(--sh)}
.slot.brk .sess{background:transparent;box-shadow:none;border-style:dashed}
.sess h4{font-size:15px;font-weight:700;line-height:1.3;letter-spacing:-.005em}
.sess .loc{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--tx2);margin-top:5px}
.sess .ds{font-size:13px;color:var(--tx2);margin-top:8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sess .ft{display:flex;align-items:center;justify-content:space-between;margin-top:12px;gap:8px}
.stack{display:flex;align-items:center}
.stack .av{border:2px solid #fff;margin-left:-8px}
.stack .av:first-child{margin-left:0}
.stack span{font-size:12px;color:var(--tx2);margin-left:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:130px}
.rate{display:inline-flex;align-items:center;gap:5px;height:34px;padding:0 12px;border-radius:10px;background:#F1F5FA;font-size:12px;font-weight:700;color:var(--tx)}
.rate.done{background:#E8F6EE;color:var(--ok)}
.stars{display:flex;gap:8px;justify-content:center;margin:8px 0 4px}
.stars button{width:48px;height:48px;display:grid;place-items:center;color:#CBD5E1;transition:transform .2s var(--ease),color .2s}
.stars button.on{color:#F5A524}
.stars button:active{transform:scale(.88)}

/* people */
.plist{padding:6px 16px 24px}
.person{display:flex;align-items:center;gap:12px;width:100%;padding:12px;border-radius:16px;background:#fff;border:1px solid var(--bd);margin-bottom:8px;min-height:68px}
.person:active{background:#F7FAFD}
.person .pm{flex:1;min-width:0}
.person .pn{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.person .pc{font-size:13px;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cc{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;color:var(--tx2);background:#F1F5FA;border-radius:8px;padding:4px 8px;flex:none;max-width:120px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cc b{color:var(--tx);font-weight:800}
.count{font-size:12px;color:var(--tx2);padding:4px 20px 2px}

/* meetings */
.mdate{display:flex;align-items:center;gap:10px;padding:16px 20px 8px;font-size:12px;font-weight:700;color:var(--tx2);text-transform:uppercase;letter-spacing:.08em}
.mdate::after{content:"";flex:1;height:1px;background:var(--bd)}
.mcard{margin:0 16px 10px;padding:14px;border-radius:18px;background:#fff;border:1px solid var(--bd);box-shadow:var(--sh);display:block;width:calc(100% - 32px)}
.mcard.rej{opacity:.6}
.mtop{display:flex;align-items:center;gap:12px}
.mtop .pm{flex:1;min-width:0}
.st{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;padding:5px 10px;border-radius:99px;white-space:nowrap}
.st i{width:6px;height:6px;border-radius:50%;background:currentColor}
.st.pending{background:#FDF3E3;color:#B45309}
.st.accepted{background:#E8F6EE;color:#15803D}
.st.rejected{background:#FDECEC;color:#B91C1C}
.mgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px}
.mgrid div{background:#F6F8FC;border-radius:12px;padding:8px 10px}
.mgrid small{display:block;font-size:10.5px;color:var(--tx2);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.mgrid b{font-size:13px;font-weight:700}
.mnote{font-size:13px;color:var(--tx2);margin-top:10px;display:flex;gap:6px}
.macts{display:flex;gap:8px;margin-top:12px}
.dir{font-size:11px;font-weight:700;color:var(--tx3);text-transform:uppercase;letter-spacing:.06em}

/* request meeting */
.who{margin:4px 16px 0;padding:14px;border-radius:20px;background:linear-gradient(150deg,var(--navy),#0c3a6b);color:#fff;display:flex;gap:12px;align-items:center}
.who .pc{color:#9fc0e0;font-size:13px}
.step{display:flex;align-items:center;gap:10px;padding:0 20px;margin:26px 0 12px}
.step b{width:24px;height:24px;border-radius:8px;background:#E8F3FB;color:var(--blue);font-size:12px;display:grid;place-items:center;font-weight:800}
.step b.ok{background:var(--blue);color:#fff}
.step h4{font-size:16px;font-weight:700;flex:1}
.step span{font-size:12px;color:var(--tx2)}
.tgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:0 16px}
.tchip{height:44px;border-radius:12px;border:1px solid var(--bd);background:#fff;font-weight:700;font-size:13.5px;text-align:center;font-variant-numeric:tabular-nums;transition:all .2s var(--ease)}
.tchip.on{background:var(--blue);color:#fff;border-color:var(--blue);box-shadow:0 8px 16px -8px rgba(0,119,200,.7)}
.lgrp{padding:0 16px}
.lgrp h5{font-size:12px;color:var(--tx2);font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin:4px 4px 8px}
.lgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.lgrid.rooms{grid-template-columns:1fr 1fr}
.lchip{min-height:50px;border-radius:12px;border:1.5px solid #CFE8D8;background:#F3FBF6;padding:7px 10px;text-align:left;transition:all .2s var(--ease)}
.lchip b{display:block;font-size:13px;font-weight:700}
.lchip small{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--ok);font-weight:600}
.lchip small i{width:6px;height:6px;border-radius:50%;background:currentColor}
.lchip.off{background:#F3F5F8;border-color:#E4EAF2;color:var(--tx3);cursor:not-allowed;background-image:repeating-linear-gradient(135deg,transparent 0 6px,rgba(148,163,184,.12) 6px 7px)}
.lchip.off small{color:var(--tx3)}
.lchip.on{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 8px 18px -8px rgba(0,119,200,.7)}
.lchip.on small{color:#cfe9ff}
.legend{display:flex;gap:14px;font-size:12px;color:var(--tx2);padding:0 20px 10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:4px;display:inline-block}
.hint{padding:14px 18px;margin:0 16px;border-radius:14px;border:1px dashed #C9D4E3;color:var(--tx2);font-size:13px;text-align:center}
.summary{display:flex;gap:8px;font-size:12.5px;color:var(--tx2);margin-bottom:10px;flex-wrap:wrap}
.summary b{color:var(--tx)}

/* explore bento */
.bento{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 16px}
.bx{border-radius:20px;padding:16px;background:#fff;border:1px solid var(--bd);box-shadow:var(--sh);display:flex;flex-direction:column;justify-content:space-between;min-height:128px;position:relative;overflow:hidden;width:100%}
.bx h4{font-size:16px;font-weight:700;letter-spacing:-.01em}
.bx p{font-size:12px;color:var(--tx2);margin-top:2px}
.bx.wide{grid-column:span 2}
.bx.tall{grid-row:span 2}
.bx.about{padding:0;min-height:170px;color:#fff;border:0}
.bx.about .art{position:absolute;inset:0;width:100%;height:100%}
.bx.about .in{position:relative;padding:16px;display:flex;flex-direction:column;justify-content:flex-end;height:100%;background:linear-gradient(180deg,transparent 20%,rgba(7,28,53,.8))}
.bx.about p{color:#cfe0f2}
.bx.spk{background:linear-gradient(170deg,#fff 40%,#E8F3FB)}
.bx .faces{display:flex;margin-bottom:14px}
.bx .faces .av{border:2px solid #fff;margin-left:-10px}
.bx .faces .av:first-child{margin-left:0}

/* speakers */
.spk{display:flex;gap:14px;align-items:flex-start;width:100%;padding:14px 4px;border-bottom:1px solid var(--bd)}
.spk:last-child{border-bottom:0}
.spk .pm{flex:1;min-width:0}
.spk .pn{font-weight:700;font-size:15px}
.spk .rl{font-size:12.5px;color:var(--blue);font-weight:600;margin-top:1px}
.spk .bio{font-size:13px;color:var(--tx2);margin-top:5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.spk .vp{font-size:12px;font-weight:700;color:var(--blue);margin-top:8px;display:inline-flex;align-items:center;gap:2px}
.prof{padding:calc(var(--sat) + 60px) 20px 26px;background:linear-gradient(170deg,var(--navy),#0c3a6b);color:#fff;text-align:center;position:relative;overflow:hidden}
.prof h1{font-size:24px;font-weight:800;margin-top:14px;letter-spacing:-.02em}
.prof .rl{color:#9fc0e0;font-size:14px;margin-top:4px}

/* about */
.abt-hero{position:relative;height:230px;overflow:hidden}
.abt-hero .art{position:absolute;inset:0;width:100%;height:100%}
.abt-hero .ov{position:absolute;inset:0;background:linear-gradient(180deg,rgba(7,28,53,.2),rgba(7,28,53,.85));display:flex;flex-direction:column;justify-content:flex-end;padding:20px;color:#fff}
.abt-hero h1{font-size:26px;font-weight:800;letter-spacing:-.025em;line-height:1.15}
.prose{padding:22px 20px 4px;font-size:15px;line-height:1.7;color:#2a3b52}
.prose p+p{margin-top:14px}
.prose .lead{font-size:17px;line-height:1.55;color:var(--tx);font-weight:500}
.res{display:flex;align-items:center;gap:14px;width:100%;padding:14px;border-radius:16px;background:#fff;border:1px solid var(--bd);margin-bottom:8px;min-height:64px}
.res:active{background:#F7FAFD}
.res .grow{flex:1;min-width:0}
.res .t{font-weight:700;font-size:14.5px}
.res .s{font-size:12px;color:var(--tx2)}
.kind{font-size:10.5px;font-weight:800;letter-spacing:.06em;padding:3px 7px;border-radius:6px;background:#F1F5FA;color:var(--tx2)}
.kind.pdf{background:#FDECEC;color:#B91C1C}

/* sponsors */
.scat{margin:0 16px 12px;background:#fff;border:1px solid var(--bd);border-radius:18px;overflow:hidden}
.scat>button{display:flex;align-items:center;justify-content:space-between;width:100%;padding:16px;min-height:56px}
.scat h4{font-size:15px;font-weight:700}
.scat .cv{transition:transform .3s var(--ease);color:var(--tx3)}
.scat.open .cv{transform:rotate(180deg)}
.lgs{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px 16px}
.lgs.big{grid-template-columns:1fr}
.logo{aspect-ratio:2/1;border-radius:14px;border:1px dashed #C9D4E3;background:#FAFBFD;display:grid;place-items:center;color:var(--tx3);font-size:12px;font-weight:600;text-align:center;padding:10px}
.lgs.big .logo{aspect-ratio:3/1}
.strip{display:flex;gap:8px;overflow-x:auto;padding:0 20px;scrollbar-width:none}
.strip button{flex:none;width:96px;height:44px;border-radius:12px;border:1px dashed #C9D4E3;background:#fff;font-size:11px;color:var(--tx3);font-weight:600;text-align:center}

/* gallery */
.gal{display:grid;grid-template-columns:1fr 1fr 1fr;grid-auto-rows:104px;gap:6px;padding:0 16px}
.ph-img{border-radius:12px;position:relative;overflow:hidden;display:block;width:100%;height:100%}
.ph-img .pl{position:absolute;left:8px;bottom:6px;font-size:10px;font-weight:700;color:rgba(255,255,255,.8);letter-spacing:.04em}
.ph-img svg.pi{position:absolute;top:50%;left:50%;margin:-12px 0 0 -12px;color:rgba(255,255,255,.55)}
.gal button{display:block;width:100%;height:100%;padding:0}
.gal .w2{grid-column:span 2}.gal .h2{grid-row:span 2}
.viewer{position:absolute;inset:0;z-index:80;background:#000;display:flex;flex-direction:column;animation:fade .25s}
.viewer .vimg{flex:1;display:grid;place-items:center;padding:0 0;position:relative;overflow:hidden}
.viewer .vimg .ph-img{width:100%;aspect-ratio:4/3;height:auto;border-radius:0;animation:zoomin .35s var(--ease)}
@keyframes zoomin{from{transform:scale(.85);opacity:0}}
.vbar{display:flex;justify-content:space-between;align-items:center;padding:calc(var(--sat) + 4px) 10px 10px;color:#fff}
.vbar .ibtn{color:#fff}
.vfoot{display:flex;gap:10px;padding:14px 16px calc(14px + var(--sab))}
.vfoot .btn{background:rgba(255,255,255,.12);color:#fff}

/* profile pass */
.pass{margin:8px 16px 0;border-radius:24px;overflow:hidden;box-shadow:0 24px 50px -18px rgba(7,28,53,.55);background:linear-gradient(155deg,#0A2540 0%,#0b3a6c 60%,#0a5b98 100%);color:#fff;position:relative}
.pass::before{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;border:1px solid rgba(34,184,240,.25);box-shadow:0 0 0 30px rgba(34,184,240,.05)}
.pass .top{display:flex;justify-content:space-between;align-items:center;padding:18px 20px 0;position:relative}
.pass .evn{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#9fc0e0}
.pass .nm{padding:18px 20px 0;position:relative}
.pass .nm h2{font-size:24px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.pass .nm p{color:#bcd4ea;font-size:14px;margin-top:3px}
.pass .flds{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:16px 20px 18px;position:relative}
.pass .flds small{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:#8fb3d6;font-weight:700}
.pass .flds b{font-size:15px;font-weight:700}
.pass .perf{height:22px;position:relative;margin:0 -1px}
.pass .perf::before{content:"";position:absolute;left:20px;right:20px;top:50%;border-top:2px dashed rgba(255,255,255,.25)}
.pass .perf i{position:absolute;top:0;width:22px;height:22px;border-radius:50%;background:var(--bg)}
.pass .perf i:first-child{left:-11px}.pass .perf i:last-child{right:-11px}
.pass .qr{padding:16px 20px 22px;display:flex;flex-direction:column;align-items:center;position:relative}
.pass .qrbox{background:#fff;padding:14px;border-radius:18px}
.pass .qr small{margin-top:10px;color:#bcd4ea;font-size:12px}
.tgl{width:51px;height:31px;border-radius:16px;background:#D5DDE8;position:relative;transition:background .25s;flex:none}
.tgl::after{content:"";position:absolute;left:2px;top:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.18);transition:transform .25s var(--ease)}
.tgl.on{background:var(--ok)}
.tgl.on::after{transform:translateX(20px)}

/* vote */
.opt{display:flex;align-items:center;gap:14px;width:100%;padding:16px;border-radius:16px;border:1.5px solid var(--bd);background:#fff;margin-bottom:10px;min-height:60px;transition:all .2s var(--ease)}
.opt .rd{width:22px;height:22px;border-radius:50%;border:2px solid #CBD5E1;display:grid;place-items:center;flex:none;transition:all .2s}
.opt.on{border-color:var(--blue);background:#F2F8FD}
.opt.on .rd{border-color:var(--blue);background:var(--blue);box-shadow:inset 0 0 0 4px #fff}
.opt.lock{pointer-events:none}
.qh{font-size:20px;font-weight:700;letter-spacing:-.015em;line-height:1.3;margin:6px 0 16px}

/* notifications */
.ntf{display:flex;gap:12px;padding:14px;background:#fff;border:1px solid var(--bd);border-radius:16px;margin:0 16px 8px;align-items:flex-start}
.ntf .grow{flex:1;min-width:0}
.ntf p{font-size:14px;line-height:1.45}
.ntf small{font-size:12px;color:var(--tx3)}

/* toast */
#toast{position:absolute;left:16px;right:16px;bottom:calc(92px + var(--sab));z-index:100;display:flex;justify-content:center;pointer-events:none}
#toast .tt{display:flex;gap:10px;align-items:center;background:var(--mid);color:#fff;padding:12px 16px;border-radius:14px;font-size:13.5px;font-weight:500;box-shadow:0 12px 30px rgba(7,28,53,.35);animation:fadeup .3s var(--ease);max-width:100%}
#toast .tt.ok svg{color:#4ADE80}
#toast .tt.err svg{color:#F87171}
.pdfp{background:#EEF2F7;border-radius:16px;padding:18px;display:grid;place-items:center}
.pdfp .pg{width:78%;aspect-ratio:1/1.35;background:#fff;border-radius:6px;box-shadow:0 8px 24px rgba(16,34,57,.12);padding:18px 16px;display:flex;flex-direction:column;gap:8px}
.pdfp .pg i{display:block;height:7px;border-radius:4px;background:#E7ECF3}
.skel{background:linear-gradient(90deg,#EEF2F7 25%,#F6F8FC 50%,#EEF2F7 75%);background-size:200% 100%;animation:shimmer 1.2s infinite;border-radius:12px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
:focus-visible{outline:2.5px solid var(--cyan);outline-offset:2px}

/* ============================================================================
   2026 PRODUCTION-STYLE DESIGN POLISH — mobile rhythm, brand, hierarchy and UX
   The layout below deliberately leaves the functional state/flows above intact.
   ============================================================================ */
:root{
  --mid:#092640;--navy:#0A2540;--blue:#0878BD;--cyan:#2BA6DA;
  --bg:#F7F9FC;--card:#FFFFFF;--tx:#10253E;--tx2:#5F7289;--tx3:#8A9AAC;
  --bd:#E7ECF3;--ok:#15803D;--warn:#BE7517;--err:#CF3445;
  --sh:0 2px 12px rgba(17,40,69,.045);
}
body{font-family:Inter,'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;font-size:14px;line-height:1.5;font-weight:400;letter-spacing:-.006em}
.stage{gap:64px;padding:30px;background:radial-gradient(circle at 12% 20%,#fff 0,#F4F8FE 35%,transparent 58%),#EAF0F8}
.side{color:var(--navy);width:300px}
.side .k{color:#0878BD;font-size:11px;letter-spacing:.16em}
.side h1{font-size:30px;color:#0B2540;line-height:1.12;letter-spacing:-.035em}
.side p{color:#64788E;font-size:14px;line-height:1.6}
.side small{color:#738399;font-size:11.5px;line-height:1.65}
.flows{gap:8px}
.flows button{color:#243E57;border:1px solid #DFE8F1;background:#fff;border-radius:12px;min-height:45px;box-shadow:0 2px 8px rgba(20,42,70,.025);font-size:12.5px;font-weight:600}
.flows button:hover{background:#EDF6FD;border-color:#A6D5ED}
.flows b{background:#E6F3FB;color:var(--blue);border-radius:8px}
.device{background:var(--bg);border-radius:48px;box-shadow:0 0 0 9px #14283A,0 0 0 10px #5A6977,0 22px 75px rgba(18,42,68,.22)}
.sbar .isl{height:29px;top:8px;width:112px;margin-left:-56px}
.screen{background:var(--bg)}
.scroll{scroll-padding-bottom:24px}
.fiata-mark{display:inline-flex;align-items:center;justify-content:center;border-radius:12px;overflow:hidden;background:#fff;flex:none;border:1px solid rgba(13,58,93,.06)}
.fiata-mark img{height:100%;width:100%;object-fit:contain;display:block}
.ttl{padding:calc(var(--sat) + 14px) 20px 8px;align-items:center}
.ttl h1{font-size:25px;letter-spacing:-.034em;line-height:1.22;font-weight:750}
.ttl .ctx{font-size:12.5px;margin-top:5px;line-height:1.4}
.phdr{padding:calc(var(--sat) + 6px) 12px 10px;min-height:calc(var(--sat) + 61px);gap:6px;background:var(--bg);border-bottom:1px solid rgba(231,236,243,.75);backdrop-filter:none}
.phdr h2{font-size:16.5px;font-weight:700;letter-spacing:-.02em}
.phdr.dk{border:0;background:transparent}
.ibtn{width:42px;height:42px;border-radius:13px}
.sec{margin-top:26px}
.sech{padding:0 20px;margin-bottom:12px;align-items:center}
.sech h3{font-size:17px;font-weight:750;letter-spacing:-.022em}
.link{font-size:12.5px;font-weight:700}
.bnav{padding:6px 10px calc(7px + var(--sab));border-top:1px solid #E4EAF1;box-shadow:0 -5px 24px rgba(11,42,66,.025);background:rgba(255,255,255,.98)}
.bind{background:#E8F4FC;top:7px;width:53px;height:33px;border-radius:12px;left:calc(10px + (var(--i) + .5) * ((100% - 20px) / 5) - 26.5px)}
.bn{font-size:11px;letter-spacing:0;gap:3px;min-height:55px;padding:5px 0 6px}
.bn svg{margin-top:2px}
.glist{margin:0 20px;border-radius:16px;box-shadow:none}
.gi{padding:12px 14px;min-height:64px;gap:12px}
.gi .t{font-size:14.5px;font-weight:650}
.gi .s{font-size:12px;line-height:1.45;margin-top:2px}
.gi+.gi::before{left:64px}
.card,.mcard,.person{border-radius:16px;box-shadow:var(--sh)}
.card{border-color:var(--bd)}
.mcard{margin-left:20px;margin-right:20px;width:calc(100% - 40px);padding:15px}
.person{min-height:72px;margin-bottom:10px;padding:12px 13px;gap:11px}
.person .pn{font-size:14.5px}
.person .pc{font-size:12.5px}
.plist{padding:8px 20px 24px}
.count{padding:8px 20px 4px;font-size:12px}
.btn{height:48px;border-radius:12px;font-size:14px;font-weight:700;box-shadow:none;letter-spacing:0}
.btn.p{box-shadow:0 4px 10px rgba(8,120,189,.13)}
.btn.sm{height:40px;font-size:12.5px}
.seg{margin-left:20px;margin-right:20px;border-radius:12px;background:#EAF0F5;padding:4px}
.seg button{font-size:12.5px;font-weight:700;line-height:1.2}
.seg button.on{box-shadow:0 1px 5px rgba(8,42,70,.07)}
.search{height:48px;border-radius:12px;box-shadow:0 1px 3px rgba(11,42,66,.015)}

  const ae=document.activeElement, fid=ae&&ae.id&&$app.contains(ae)?ae.id:null; let sel=null; try{sel=ae.selectionStart}catch(e){}

  // Pin sponsor logos only on inner app screens, not the event list or Home dashboard.
  if(!S.authOpen && (S.phase==='app'||S.phase==='events')){
    const root=$app.querySelector('.screen');

      const header=pageScroll.querySelector(':scope > .ttl, :scope > .events-list-head, :scope > .home-top, :scope > .evhead, :scope > .events-clean-head');
      if(header){

      const isInnerPage=S.phase==='app' && (S.stack.length>0 || S.tab!=='home');
      if(isInnerPage){
        const sponsorContainer=document.createElement('div');

        root.insertBefore(sponsorContainer,nav||null);

  }
  const scr=$app.querySelector('.screen');

  $app.querySelectorAll('[data-k]').forEach(e=>{const k=e.dataset.k, isSheet=k.startsWith('sh');
    if(keep[k] && (isSheet? shk===lastSheet : sk===lastScreen)){e.scrollTop=keep[k][0];e.scrollLeft=keep[k][1];}});
  const sw=$app.querySelector('.sw'); if(sw && shk!==lastSheet) sw.classList.add('in');

  if(fid){const el=document.getElementById(fid); if(el){el.focus({preventScroll:true}); if(sel!=null) try{el.setSelectionRange(sel,sel)}catch(e){}}}

}

function requestV(id){

  const step=(n,t,ok,sub='')=>`<div class="step"><b class="${ok?'ok':''}">${ok?ic('check',13,3):n}</b><h4>${t}</h4><span>${sub}</span></div>`;
  const locs=(arr)=>arr.map(l=>{const un=r.day==null||!r.time?false:!avail(r.day,r.time,l), on=r.loc===l;
    return `<button class="lchip ${un?'off':''} ${on?'on':''}" ${un?'aria-disabled="true"':''} data-a="loc" data-p="${l}" aria-label="${l}, ${un?'unavailable':'available'}"><b>${l.replace('Meeting ','')}</b><small><i></i>${un?'Unavailable':on?'Selected':'Available'}</small></button>`}).join('');
  return `<div class="screen">${phdr('Request Meeting')}<div class="scroll" data-k="req">
   <div class="who">${av(a.n,48)}<div style="flex:1;min-width:0"><div style="font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#7fb0dc;font-weight:700">Meeting with</div><div style="font-weight:700;font-size:17px">${esc(a.n)}</div><div class="pc">${esc(a.c)} · ${esc(a.co)}</div></div></div>
   <section class="meeting-datetime" aria-label="Meeting date and time">
     <div class="meeting-field">
       <label for="meeting-date">${ic('calendar',17,2)} Meeting Date <span class="meeting-required">*</span></label>
       <div class="meeting-select-wrap">
         <select class="meeting-select ${r.day==null?'meeting-select-placeholder':''}" id="meeting-date" data-meeting-select="date" required>
           <option value="" ${r.day==null?'selected':''} disabled>Select a date</option>
           ${DAYS.map((d,i)=>`<option value="${i}" ${r.day===i?'selected':''}>${d.dow}, ${d.label} ${eventYear}</option>`).join('')}
         </select>
         ${ic('down',19,2)}
       </div>
     </div>
     <div class="meeting-field">
       <label for="meeting-time">${ic('clock',17,2)} Meeting Time <span class="meeting-required">*</span></label>
       <div class="meeting-select-wrap">
         <select class="meeting-select ${!r.time?'meeting-select-placeholder':''}" id="meeting-time" data-meeting-select="time" required>
           <option value="" ${!r.time?'selected':''} disabled>Select a time</option>
           ${TIMES.map(t=>`<option value="${t}" ${r.time===t?'selected':''}>${formatMeetingTime(t)}</option>`).join('')}
         </select>
         ${ic('down',19,2)}
       </div>
     </div>
     <p class="meeting-field-help">Choose a suitable date and time for your meeting.</p>
   </section>
   ${step(3,'Meeting Location',!!r.loc,'Choose a room or table')}
   ${r.day==null||!r.time? `<div class="hint">${ic('info',16).replace('<svg','<svg style="display:inline;vertical-align:-3px;margin-right:6px"')}Choose a date and time to see available locations</div>`
     : `<div class="legend"><span><i style="background:#F3FBF6;border:1.5px solid #CFE8D8"></i>Available</span><span><i style="background:#F3F5F8;border:1.5px solid #E4EAF2"></i>Unavailable</span><span><i style="background:var(--blue)"></i>Selected</span></div>
       <div class="lgrp"><h5>Rooms</h5><div class="lgrid rooms">${locs(ROOMS)}</div><h5>Tables</h5><div class="lgrid">${locs(TABLES)}</div></div>`}
   ${step(4,'Message',false,'Optional')}
   <div class="pad"><textarea id="rnote" class="inp" data-in="rnote" maxlength="250" placeholder="e.g. I'd like to discuss potential collaboration.">${esc(r.note)}</textarea></div>
   ${r.err?`<div class="pad"><div class="msg e" role="alert">${ic('alert',16,2)}<span>${esc(r.err)}</span></div></div>`:''}
   <div style="height:24px"></div></div>
   <div class="foot">${r.day!=null&&r.time&&r.loc?`<div class="summary"><b>${DAYS[r.day].label}</b>·<b>${r.time}</b>·<b>${esc(r.loc)}</b></div>`:''}<button class="btn p" data-a="submitReq" ${r.busy?'disabled':''}>${r.busy?'<span class="spin"></span> Sending request…':`${ic('send',17,2)} Request Meeting`}</button></div></div>`;
}
function avail(day,time,loc){
  if(S.meetings.some(m=>m.day===day&&m.time===time&&m.loc===loc&&m.status!=='rejected')) return false;
  return hash(day+'|'+time+'|'+loc)%4!==0; // demo: ~25% booked by other delegates
}
function voteV(){
  const v=S.vote;

  if(!S.user) body=gate('Sign in to vote','Voting is available to registered delegates.');
  else body=`<div class="pad"><div class="qh">${esc(POLL.q)}</div>

  return `<div class="screen">${phdr('Vote')}<div class="scroll" data-k="vote"><div class="pad inner-intro"><p class="tiny">${esc(ev().short)}</p></div>${body}</div>
   ${S.user&&!v.done?`<div class="foot"><button class="btn p" data-a="submitVote" ${v.busy?'disabled':''}>${v.busy?'<span class="spin"></span>':'Submit Vote'}</button></div>`:''}</div>`;
}
function notifV(){
  const ago=t=>{const m=Math.round((Date.now()-t)/6e4); return m<1?'Just now':m<60?m+' min ago':m<1440?Math.round(m/60)+' h ago':Math.round(m/1440)+' d ago'};
  const today=S.notifs.filter(n=>Date.now()-n.t<864e5), older=S.notifs.filter(n=>Date.now()-n.t>=864e5);
  const item=n=>`<div class="ntf"><span class="tint t-blue">${ic('bell',18)}</span><div class="grow"><p>${esc(n.m)}</p><small>${ago(n.t)}</small></div><button class="ibtn" style="width:40px;height:40px;color:var(--tx3)" aria-label="Delete notification" data-a="delNotif" data-p="${n.id}">${ic('trash',17)}</button></div>`;
  return `<div class="screen">${phdr('Notifications')}<div class="scroll" data-k="nt">
   <div class="inner-page-top-gap" aria-hidden="true"></div>

     <button class="gi" data-a="pref" data-p="push" role="switch" aria-checked="${S.prefs.push}"><span class="tint t-blue">${ic(S.prefs.push?'bell':'bellOff',18)}</span><span class="grow"><div class="t">Notifications</div><div class="s">Alerts on this device</div></span><span class="tgl ${S.prefs.push?'on':''}"></span></button>
     <button class="gi" data-a="pref" data-p="email" role="switch" aria-checked="${S.prefs.email}"><span class="tint t-navy">${ic('mail',18)}</span><span class="grow"><div class="t">Email Notifications</div><div class="s">Copies to your registered email</div></span><span class="tgl ${S.prefs.email?'on':''}"></span></button>
   </div>
   ${S.notifs.length? `${today.length?`<div class="mdate">Today</div>${today.map(item).join('')}`:''}${older.length?`<div class="mdate">Earlier</div>${older.map(item).join('')}`:''}`
    : `<div class="empty" style="margin-top:30px"><div class="eic">${ic('inbox',24)}</div><h4>You're all caught up</h4><p>Event announcements and meeting updates will appear here.</p></div>`}
   <div style="height:24px"></div></div></div>`;
}

function startResend(){
  S.login.resend=30;clearInterval(resendTimer);
  resendTimer=setInterval(()=>{
    if(!S.authOpen||S.login.stage!==2){clearInterval(resendTimer);return;}
    S.login.resend=Math.max(0,S.login.resend-1);
    const btn=$app.querySelector('[data-login-resend]');
    if(btn){btn.disabled=S.login.resend>0;btn.textContent=S.login.resend>0?'Resend code in '+S.login.resend+'s':'Resend code';}
    if(S.login.resend===0)clearInterval(resendTimer);
  },1000);
}

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]'); if(!el||!$dev.contains(el)) return;
  const fn=A[el.dataset.a]; if(!fn) return;
  if(el.tagName!=='A') e.preventDefault();
  e.stopPropagation();
  fn(el.dataset.p, el);
});
document.addEventListener('input',e=>{ const k=e.target.dataset&&e.target.dataset.in; if(k&&IN[k]) IN[k](e.target.value); });
document.addEventListener('change',e=>{
  const select=e.target.closest?.('select[data-meeting-select]');
  if(!select || !$dev.contains(select) || !S.req) return;
  if(select.dataset.meetingSelect==='date') A.rDay(select.value);
  else if(select.dataset.meetingSelect==='time') A.rTime(select.value);
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){ if(S.viewer) return A.closeViewer(); if(S.sheet) return closeSheet(); if(S.authOpen) return A.cancelLogin(); }
  if(e.key==='Enter' && e.target.id==='reg') A.getCode();
  if(e.key==='Enter' && e.target.id==='code') A.doLogin();
  if(S.viewer && (e.key==='ArrowRight'||e.key==='ArrowLeft')) A.vNav(e.key==='ArrowRight'?1:-1);
});

render();
const splashT=setTimeout(()=>A.toEvents(),2200);
</script>
<script>
/* Refined navigation, swipeable banners and latest-first meeting previews. */
(function(){
  // These are visibly labelled prototype records; real delegate data stays behind login.
  if(!S.meetings.some(m=>m.id==='m-demo-recent-1')){
    S.meetings.push({id:'m-demo-recent-1',with:'a12',day:0,time:'14:00',loc:'Meeting Room 1',note:'Meeting confirmed',status:'accepted',dir:'in',demo:1});
    S.meetings.push({id:'m-demo-recent-2',with:'a8',day:1,time:'15:30',loc:'Table 03',note:'Awaiting confirmation',status:'pending',dir:'out',demo:1});
  }
  A.openAgenda=function(){
    S.tab='home';S.stack=[];push('agenda');
  };
  A.openEventList=function(){
    S.sheet=null; S.viewer=null; S.stack=[]; S.eventsTab='active'; S.phase='events';
    render('pop');
  };
  A.bannerEvent=function(id){
    if(S.eventId!==id){S.eventId=id;setEventContext(id);}
    S.phase='app';S.tab='home';S.stack=[];
    push('about');
  };
  A.homeMeeting=function(id){
    if(!S.user)return requireLogin(()=>A.homeMeeting(id),'1 × 1 Meetings');
    S.hl=id; S.net='meetings'; S.tab='network'; S.stack=[]; render('fade');
    setTimeout(()=>{
      const el=$app.querySelector('[data-mid="'+id+'"]');
      if(el) el.scrollIntoView({behavior:'smooth',block:'center'});
    },260);
  };
  A.railJump=function(p){
    const [key,indexText]=p.split(':');
    const rail=$app.querySelector('[data-rail="'+key+'"]');
    if(!rail) return;
    const slides=rail.querySelectorAll('[data-slide]');
    const i=Math.min(Math.max(0,Number(indexText)),slides.length-1);
    if(slides[i]) rail.scrollTo({left:slides[i].offsetLeft-slides[0].offsetLeft,behavior:'smooth'});
  };
  // Automatically advance the official image banners while Home is visible.
  // Pause after manual interaction, when hidden or when reduced motion is requested.
  let lastBannerInteraction=0;
  document.addEventListener('pointerdown',e=>{if(e.target.closest?.('[data-rail="hero"], [data-dot-rail="hero"]'))lastBannerInteraction=Date.now();},true);
  document.addEventListener('wheel',e=>{if(e.target.closest?.('[data-rail="hero"]'))lastBannerInteraction=Date.now();},{capture:true,passive:true});
  setInterval(()=>{
    if(S.phase!=='app'||S.tab!=='home'||S.stack.length||S.sheet||S.viewer||document.hidden||
       matchMedia('(prefers-reduced-motion: reduce)').matches||Date.now()-lastBannerInteraction<7000)return;
    const rail=$app.querySelector('[data-rail="hero"]');if(!rail)return;
    const slides=[...rail.querySelectorAll('[data-slide]')];if(slides.length<2)return;
    const left=rail.scrollLeft,first=slides[0].offsetLeft;
    const current=slides.reduce((best,item,i)=>Math.abs(item.offsetLeft-first-left)<Math.abs(slides[best].offsetLeft-first-left)?i:best,0);
    const next=slides[(current+1)%slides.length];
    rail.scrollTo({left:next.offsetLeft-first,behavior:'smooth'});
  },4200);
  document.addEventListener('scroll',function(e){
    const rail=e.target?.closest?.('[data-rail]');
    if(!rail) return;
    const key=rail.dataset.rail;
    const slides=[...rail.querySelectorAll('[data-slide]')];
    if(!slides.length)return;
    const index=slides.reduce((best,slide,i)=>Math.abs(slide.offsetLeft-slides[0].offsetLeft-rail.scrollLeft)<Math.abs(slides[best].offsetLeft-slides[0].offsetLeft-rail.scrollLeft)?i:best,0);
    $app.querySelectorAll('[data-dot-rail="'+key+'"]').forEach((dot,i)=>{
      dot.classList.toggle('active',i===index);
      dot.setAttribute('aria-current',i===index?'true':'false');
    });
    const counter=$app.querySelector('[data-counter-rail="'+key+'"]');
    if(counter)counter.textContent=(index+1)+' of '+slides.length;
  },true);
  eventsV=function(){
    const list=EVENTS.filter(e=>e.status===S.eventsTab);
    return `<div class="screen"><div class="scroll" data-k="ev">
      <header class="events-list-head events-brand-header">
        <div class="events-brand-row">
          <div class="events-brand-identity">
            ${brandLogo(42)}
            <span class="events-brand-name">FIATA</span>
          </div>
          <nav class="events-brand-socials" aria-label="Official FIATA website and social media">
            <a class="events-social-icon" href="https://fiata.org/" target="_blank" rel="noopener noreferrer" aria-label="Visit FIATA's official website" title="Website">
              <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18"/></svg>
            </a>
            <a class="events-social-icon" href="https://www.linkedin.com/company/fiatafederation/" target="_blank" rel="noopener noreferrer" aria-label="FIATA on LinkedIn" title="LinkedIn">
              <svg viewBox="0 0 24 24" width="19" height="19" fill="currentColor" aria-hidden="true"><path d="M5.2 8.4a2.1 2.1 0 1 0 0-4.2 2.1 2.1 0 0 0 0 4.2ZM3.5 10h3.4v10.5H3.5V10Zm5.4 0h3.25v1.43h.05c.45-.86 1.55-1.78 3.18-1.78 3.4 0 4.03 2.18 4.03 5.03v5.82H16v-5.16c0-1.23-.02-2.82-1.72-2.82-1.73 0-1.99 1.35-1.99 2.73v5.25H8.9V10Z"/></svg>
            </a>
            <a class="events-social-icon" href="https://www.instagram.com/fiatafederation/" target="_blank" rel="noopener noreferrer" aria-label="FIATA on Instagram" title="Instagram">
              <svg viewBox="0 0 24 24" width="19" height="19" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" fill="none" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg>
            </a>
            <a class="events-social-icon" href="https://www.facebook.com/fiatafederation/" target="_blank" rel="noopener noreferrer" aria-label="FIATA on Facebook" title="Facebook">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><path d="M14.6 21v-8h2.69l.41-3.13H14.6v-2c0-.91.25-1.52 1.55-1.52h1.66V3.56A22.5 22.5 0 0 0 15.38 3c-2.4 0-4.04 1.46-4.04 4.14v2.73H8.63V13h2.71v8h3.26Z"/></svg>
            </a>
          </nav>
        </div>
        <h1>Events</h1>
      </header>
      <div class="seg events-list-tabs" role="tablist" aria-label="Event status">
        ${['active','past'].map(k=>`<button role="tab" aria-selected="${S.eventsTab===k?'true':'false'}" class="${S.eventsTab===k?'on':''}" data-a="evTab" data-p="${k}">${k==='active'?'Active':'Past'}</button>`).join('')}
      </div>
      ${list.length?`<div class="events-list-stack" aria-label="Events list">
        ${list.map(e=>`<button class="events-list-card press" data-a="pickEvent" data-p="${e.id}" aria-label="Open ${esc(e.name)}">
          <div class="events-list-art">${officialEventImage(e)}</div>
          <div class="events-list-info"><div class="events-list-title">${esc(e.name)}</div>
            ${e.date?`<div class="events-list-meta">${ic('calendar',14)} ${esc(e.date)}</div>`:''}
            <div class="events-list-bottom"><span class="events-list-open">View event ${ic('arrow',17,2)}</span>
              ${e.venue?`<span class="events-list-meta venue">${ic('pin',14)} ${esc(e.venue)}</span>`:''}</div>
          </div>
        </button>`).join('')}
      </div>`:
      `<div class="events-none"><h3>No past events available</h3><p>Past events will appear here when they are added to the event list.</p><button class="btn s sm" style="margin-top:16px" data-a="evTab" data-p="active">View active events</button></div>`}
    </div></div>`;
  };
  homeV=function(){
    const e=ev(),u=S.user;
    const mine=u?S.meetings.slice().reverse().filter(m=>m.status!=='rejected'):[];
    const meetingPreview = !u ?
      `<button class="home-meeting-row home-meeting-guest press" data-a="goNet" data-p="meetings"><span class="meeting-icon">${ic('lock',20,1.9)}</span><span class="home-meeting-copy"><strong>Sign in to view 1 × 1 meetings</strong><small>Your requests, confirmations and latest meetings</small></span><span class="more-arrow">${ic('right',19,2)}</span></button>`:
      mine.length? `<div class="home-meetings-rail" data-k="home-meetings" data-rail="meetings" role="region" aria-label="Recent meetings, newest first">${mine.map(m=>{
       const person=byId(ATTENDEES,m.with),day=DAYS[m.day];
       return `<button data-slide class="home-meeting-swipe-card press" data-mid="${m.id}" data-a="homeMeeting" data-p="${m.id}" aria-label="View meeting with ${esc(person?.n||'Delegate')}">
         <div class="home-meeting-card-top">${av(person?.n||'Delegate',35)}<span class="home-meeting-card-name"><strong>${esc(person?.n||'Delegate')}</strong><small>${esc(person?.c||'')}</small></span></div>
         ${stPill(m.status)}
         <div class="home-meeting-card-bottom"><span class="home-meeting-pill">${ic('calendar',12)} ${esc(day?.label||'Event day')}</span><span class="home-meeting-pill">${ic('clock',12)} ${esc(m.time)}</span><span class="home-meeting-pill">${ic('pin',12)} ${esc(m.loc)}</span></div>
       </button>`;
      }).join('')}</div>`:
      `<button class="home-meeting-row home-meeting-guest press" data-a="goNet" data-p="people"><span class="meeting-icon">${ic('calPlus',20,1.9)}</span><span class="home-meeting-copy"><strong>No meetings scheduled</strong><small>Find a delegate to request a meeting</small></span><span class="more-arrow">${ic('right',19,2)}</span></button>`;
    const menus=[
      ['about','info','About Event','Overview, brochure & registration links','push'],
      ['vote','vote','Vote','Take part in event polls','push'],
      ['sponsors','award','Sponsors & Partners','Event sponsors by category','push']
    ];
    return tabbed(`<div class="scroll home-scroll" data-k="home">
      <div class="home-top"><div class="home-toolbar simple-home-toolbar">
        <button class="home-change-button" data-a="openEventList" aria-label="Change event, opens event list">${ic('swap',18,2)}<span>Change Event</span>${ic('right',15,2)}</button>
        <button class="home-tool home-notification" aria-label="Notifications" data-a="push" data-p="notifs">${ic('bell',21,1.8)}</button>
      </div></div>
             <section class="home-event-section" aria-label="Event banner gallery">
         <div class="home-banner-rail image-banner-rail" data-k="home-banner" data-rail="hero" role="region" aria-label="Swipeable official event banners">
           ${EVENTS.map(item=>`<button data-slide class="home-banner-slide image-banner-card press" data-a="bannerEvent" data-p="${item.id}" aria-label="View ${esc(item.name)} banner and event information">
             ${officialEventImage(item)}
           </button>`).join('')}
         </div>
         <div class="home-hints" aria-label="Banner position">${EVENTS.map((item,i)=>`<button class="rail-dot ${i===0?'active':''}" data-dot-rail="hero" data-a="railJump" data-p="hero:${i}" aria-label="Show banner ${i+1}" aria-current="${i===0?'true':'false'}"></button>`).join('')}<small data-counter-rail="hero">1 of ${EVENTS.length}</small></div>
       </section>
       <section class="home-actions" aria-label="Quick access">
         <div class="home-section-head"><h2>Quick Access</h2></div>
         <div class="home-action-grid">
           <button class="home-action-card primary press" data-a="openAgenda" aria-label="Open Agenda">
             <span class="action-icon">${ic('calendar',23,1.9)}</span><span class="action-arrow">${ic('arrowUR',18,2)}</span>
             <span><strong>Agenda</strong><small>Sessions & schedule</small></span>
           </button>
           <button class="home-action-card secondary press" data-a="goNet" data-p="people" aria-label="Find Delegates">
             <span class="action-icon">${ic('users',23,1.9)}</span><span class="action-arrow">${ic('arrowUR',18,2)}</span>
             <span><strong>Find Delegates</strong><small>Connect & meet</small></span>
           </button>
         </div>
       </section>
       <section class="home-meeting-section"><div class="home-section-head"><h2>1 × 1 Meetings</h2><button class="home-text-action" data-a="goNet" data-p="meetings">View all ${ic('right',15,2)}</button></div>
        ${u&&mine.length? meetingPreview:
          `<div style="padding:0 20px">${meetingPreview}</div>`}
        ${u&&mine.length>1?`<div class="home-meeting-foot"><span>Swipe for more · Latest first</span><strong data-counter-rail="meetings">1 of ${mine.length}</strong></div>`:''}
      </section>
      <section class="home-discover-section"><div class="home-section-head"><h2>Explore the event</h2></div>
        <div class="home-menu-list">${menus.map(([key,icon,title,subtitle,action])=>`<button class="home-menu-item press" data-a="${action}" data-p="${key}"><span class="home-menu-icon">${ic(icon,18,1.85)}</span><span class="home-menu-copy"><strong>${title}</strong><small>${subtitle}</small></span>${ic('right',17,2)}</button>`).join('')}</div>
      </section>
      
    </div>`);
  };
})();

</script>
</body>
</html>
